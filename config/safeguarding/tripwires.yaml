# Deterministic safeguarding tripwires (SPEC.md section 9.2, step 2): phrases that end tutoring at
# once and show the safeguarding script, before any model sees the message. High recall on
# purpose: a false alarm costs a student a minute; a miss can cost far more. Phrases that are also
# everyday sayings ("beats me", "in danger of failing", "I can't cope with algebra") are left to
# the input classifier, which reads the whole message.
#
# STATUS: DRAFT. Written by the build team from common UK safeguarding guidance. It must be
# reviewed by Eddy's named safeguarding lead before any real student uses the tutor (PLAN.md
# approval gate).
#
# Matching (services/api/src/eddy_api/tutor/safeguarding.py): the text is put in NFKC form,
# invisible characters are removed, look-alike letters from other alphabets are folded to Latin,
# then it is lower-cased with punctuation and apostrophes removed and spaces collapsed. A phrase
# matches whole words; a final "*" also matches any ending ("self harm*" matches "self harming").
# Letters typed with spaces between them are joined ("s u i c i d e"), and "my self" is read as
# "myself". Words after a "!" must not follow the phrase ("im in danger !of" leaves "I'm in
# danger of failing" to the classifier).
#
# severity: IMMEDIATE (risk to life now), HIGH (harm, abuse or neglect), MEDIUM (distress or
# bullying).

