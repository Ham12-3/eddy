# The only place Claude model IDs live (SPEC.md section 10, ADR-0005).
# Changing a route's model needs the matching eval suite to pass before merge.
# Never add temperature, top_p or top_k: the API rejects them on every model.

routes:
  tutor.turn:
    model: claude-opus-4-8
    thinking: adaptive # must be explicit on Opus 4.8; omitting it means no thinking
    effort: low # tuned by the pedagogy eval
  scene.generate:
    model: claude-opus-4-8
    thinking: adaptive
    effort: high
  scene.critique:
    model: claude-opus-4-8
    thinking: adaptive
    effort: medium
  safety.input:
    model: claude-haiku-4-5
    thinking: none # Haiku 4.5 takes no effort parameter
  safety.output:
    model: claude-haiku-4-5
    thinking: none
  misconception.classify:
    model: claude-haiku-4-5
    thinking: none
  eval.judge:
    model: claude-haiku-4-5
    thinking: none
  eval.judge.calibration:
    model: claude-opus-4-8
    thinking: adaptive
    effort: medium

# List prices in US dollars per million tokens, for the cost estimates in llm_call (SPEC.md
# section 6.5). Writing to the 5-minute prompt cache costs 1.25 times the input price and reading
# from it a tenth. Check them against the pricing page when a model changes.
pricing:
  usd_to_gbp: 0.79 # an estimate: llm_call costs are estimates, not invoices
  models:
    claude-opus-4-8: { input: 5.00, output: 25.00, cache_write: 6.25, cache_read: 0.50 }
    claude-haiku-4-5: { input: 1.00, output: 5.00, cache_write: 1.25, cache_read: 0.10 }
