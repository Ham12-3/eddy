# The only place model IDs live (SPEC.md section 10, ADR-0005, ADR-0036).
# Changing a route's model needs the matching eval suite to pass before merge.
# Never add temperature, top_p or top_k to a route: the API rejects them on every model.

routes:
  tutor.turn:
    model: claude-opus-4-8
    thinking: adaptive # must be explicit on Opus 4.8; omitting it means no thinking
    effort: low # tuned by the pedagogy eval
  scene.generate:
    model: claude-opus-4-8
    thinking: adaptive
    effort: medium # high passed 96/100 but took 27 s at p95 (M6 eval)
  scene.critique:
    model: claude-opus-4-8
    thinking: adaptive
    effort: medium
  safety.input:
    model: claude-haiku-4-5
    thinking: none # Haiku 4.5 takes no effort parameter
  safety.output:
    model: claude-haiku-4-5
    thinking: none
  misconception.classify:
    model: claude-haiku-4-5
    thinking: none
  eval.judge:
    model: claude-haiku-4-5
    thinking: none
  eval.judge.calibration:
    model: claude-opus-4-8
    thinking: adaptive
    effort: medium

# The desktop app's local model (ADR-0036): a GGUF file served on the student's own computer by
# llama.cpp, for the routes listed. Tier L scenes have no local model. The temperature here is
# given to the model server when it starts; requests never carry sampling settings.
local:
  model: granite-4.0-micro-q4 # IBM Granite 4.0 Micro, Apache 2.0, from IBM's own GGUF files
  file: granite-4.0-micro-Q4_K_M.gguf
  context: 8192
  temperature: 0.2
  routes: [tutor.turn, safety.input, safety.output]

# List prices in US dollars per million tokens, for the cost estimates in llm_call (SPEC.md
# section 6.5). Writing to the 5-minute prompt cache costs 1.25 times the input price and reading
# from it a tenth. Check them against the pricing page when a model changes.
pricing:
  usd_to_gbp: 0.79 # an estimate: llm_call costs are estimates, not invoices
  models:
    claude-opus-4-8: { input: 5.00, output: 25.00, cache_write: 6.25, cache_read: 0.50 }
    claude-haiku-4-5: { input: 1.00, output: 5.00, cache_write: 1.25, cache_read: 0.10 }
