name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests, synth
    runs-on: ubuntu-latest
    services:
      # Matches compose.yaml, so the default DATABASE_URL works unchanged.
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: eddy
          POSTGRES_PASSWORD: eddy
          POSTGRES_DB: eddy
        ports:
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -U eddy -d eddy"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Database tests fail here instead of skipping.
      EDDY_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked
      - name: Curriculum YAML matches its schemas
        run: pnpm curriculum:check
      - run: pnpm check
      - name: Maths golden set (100% required)
        run: pnpm evals
      - name: maths-core coverage (85% or more)
        run: pnpm maths:coverage
      - name: Verification latency (p95 under 150 ms)
        run: pnpm maths:bench
      - name: Learner model coverage (85% or more)
        run: pnpm learner:coverage
      - name: API client matches services/api
        run: pnpm api-client:generate && git diff --exit-code -- packages/api-client
      - name: CDK synth (no deploy)
        run: pnpm --filter @eddy/infra synth

  e2e:
    name: Playwright E2E and axe
    runs-on: ubuntu-latest
    services:
      # Matches compose.yaml, so the default DATABASE_URL works unchanged.
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: eddy
          POSTGRES_PASSWORD: eddy
          POSTGRES_DB: eddy
        ports:
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -U eddy -d eddy"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e-artifacts/
            playwright-report/
            test-results/
          retention-days: 14

  storybook:
    name: Design system stories, axe and screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e:storybook
      - name: Upload story screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-artifacts
          path: |
            e2e-artifacts/storybook/
            playwright-report/storybook/
            test-results/storybook/
          retention-days: 14
