[project]
name = "eddy-workspace"
version = "0.0.0"
description = "Virtual root of the Eddy Python workspace (not a package)."
requires-python = ">=3.12,<3.13"
dependencies = ["eddy-api", "eddy-maths-core"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx2",
    "types-pyyaml>=6.0.12.20261103",
    "types-jsonschema>=4.26.0.20261006",
    "hypothesis>=6.170.14",
    "pytest-cov>=7.1.0",
    "datamodel-code-generator==0.85.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/api", "services/maths-core"]

[tool.uv.sources]
eddy-api = { workspace = true }
eddy-maths-core = { workspace = true }

[tool.datamodel-codegen]
# pnpm schemas:generate: pydantic models from the JSON Schema that packages/schemas emits.
input = "packages/schemas/generated/scene-spec.schema.json"
input-file-type = "jsonschema"
output = "services/api/src/eddy_api/scenes/spec.py"
output-model-type = "pydantic_v2.BaseModel"
target-python-version = "3.12"
use-standard-collections = true
use-union-operator = true
use-annotated = true
field-constraints = true
disable-timestamp = true
use-title-as-name = true
use-double-quotes = true
enum-field-as-literal = "all"
snake-case-field = true
formatters = ["ruff-format", "ruff-check"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "RUF", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["eddy_api", "eddy_maths_core"]

[tool.ruff.lint.per-file-ignores]
"services/*/tests/**" = ["S101", "S105", "S106", "S311"]  # S311: seeded simulations
# Generated from the JSON Schema: a recursive RootModel needs Optional with string forward references.
"services/api/src/eddy_api/scenes/spec.py" = ["UP045"]
# Autogenerated migrations keep Alembic's long lines.
"services/api/migrations/versions/**" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = [
  "services/api/src",
  "services/api/tests",
  "services/maths-core/src",
  "services/maths-core/tests",
]

[[tool.mypy.overrides]]
# SymPy ships no type information.
module = ["sympy", "sympy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["services/api/tests", "services/maths-core/tests"]
addopts = "--import-mode=importlib -q"
