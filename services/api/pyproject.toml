[project]
name = "eddy-api"
version = "0.0.0"
description = "Eddy domain API, learner model and tutor orchestration (ADR-0003)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyjwt[crypto]>=2.10",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pyyaml>=6.0",
  "jsonschema>=4.23",
  "fsrs>=6.3.2",
  "anthropic>=2.6.0",
  "httpx>=0.28.1",
  "langgraph>=1.2.20",
  "langgraph-checkpoint-postgres>=3.2.0",
  "redis>=8.1.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"
