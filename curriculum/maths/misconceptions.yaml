  # G20: Pythagoras
  - code: PYTH_ADD_FOR_SHORTER_SIDE
    node: G20
    title: "Adds the squares when finding a shorter side"
    student: "The hypotenuse is the longest side, so its square is the biggest. The other two squares add up to it. To find a shorter side, subtract the smaller square from the bigger one."
    teacher: "Uses a² + b² when the hypotenuse is known."
