    qualification: MATHS
    spec_code: "8300"
    version: "2015"
    title: AQA GCSE Mathematics
    content: { board: DFE, spec_code: GCSE-MATHS, version: "2013" }
    valid_from: 2015-09-01
    papers:
      - { paper: "1", tiers: [FOUNDATION, HIGHER], minutes: 90, marks: 80, calculator: false }
      - { paper: "2", tiers: [FOUNDATION, HIGHER], minutes: 90, marks: 80, calculator: true }
      - { paper: "3", tiers: [FOUNDATION, HIGHER], minutes: 90, marks: 80, calculator: true }

