# Specifications. Paper structures are facts about the assessments, described in our own words;
# no exam board questions, mark schemes or wording appear anywhere in Eddy (SPEC.md section 12).
# Exam board maths specifications build on the DfE subject content (content: DFE/GCSE-MATHS/2013).

specs:
