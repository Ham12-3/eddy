# English Literature set texts (SPEC.md section 6.6). Data model only in the MVP.
# Titles and authors are facts about the specification; no text, notes or questions appear here.
# display:
#   FULL_TEXT       public domain in the UK, so the whole text may be shown
#   REFERENCE_ONLY  in copyright: named and discussed, never reproduced
#   (QUOTATIONS_ONLY stays unused until legal advice on fair dealing, docs/brief.md section 4)
# Copyright status follows docs/brief.md section 4; check it again before any text is shown.
# The list is not yet checked against the board's current list of modern texts (more were
# added for first teaching in 2024); do that before any English feature is built on it.

set_texts:
  # Shakespeare: public domain (modern editions' notes and lineation are not)
  - board: AQA
    category: SHAKESPEARE
    title: Macbeth
    author: William Shakespeare
    copyright: PUBLIC_DOMAIN
    display: FULL_TEXT
